<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muammer | 3D Gerçekçi Satranç</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at center, #2c3e50, #0f172a);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
    }
    header {
      text-align: center;
      margin-bottom: 10px;
    }
    header h1 {
      font-size: 1.5rem;
      color: #f39c12;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      letter-spacing: 1px;
    }
    .status {
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    /* 3D Görünümlü Satranç Tahtası Konteyneri */
    .board-container {
      perspective: 900px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 15px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.1);
      border: 2px solid #34495e;
    }

    .chess-board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 360px;
      height: 360px;
      border: 4px solid #1a252f;
      transform: rotateX(15deg);
      transform-style: preserve-3d;
      box-shadow: 0 15px 25px rgba(0,0,0,0.6);
    }

    @media (min-width: 400px) {
      .chess-board { width: 380px; height: 380px; }
    }

    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: background 0.2s;
    }

    .light { background: #e0d7c3; color: #111; }
    .dark { background: #8b6f47; color: #111; }

    .square.selected {
      background: #f1c40f !important;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .square.highlight::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: rgba(46, 204, 113, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 8px #2ecc71;
    }

    /* 3D Gerçekçi Taş Görünümleri */
    .piece {
      display: inline-block;
      filter: drop-shadow(0 6px 4px rgba(0,0,0,0.6));
      transform: translateZ(12px);
      transition: transform 0.2s ease;
    }
    .piece:active {
      transform: translateZ(20px) scale(1.1);
    }

    .white-piece {
      color: #fff;
      text-shadow: 0 0 2px #000, 0 2px 4px rgba(0,0,0,0.7);
    }
    .black-piece {
      color: #1a1a1a;
      text-shadow: 0 0 2px #fff, 0 2px 4px rgba(255,255,255,0.3);
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    .btn-reset {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(231,76,60,0.4);
    }
    .btn-reset:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <header>
    <h1>CHESS 3D | 2 Kişilik</h1>
  </header>

  <div class="status" id="game-status">Sıra: <span style="color:#fff; font-weight:bold;">Beyaz</span></div>

  <div class="board-container">
    <div class="chess-board" id="board"></div>
  </div>

  <div class="controls">
    <button class="btn-reset" onclick="resetGame()">Oyunu Sıfırla</button>
  </div>

  <script>
    // Gerçekçi Satranç Karakterleri (Semboller)
    const pieces = {
      wR: '♖', wN: '♘', wB: '♗', wQ: '♕', wK: '♔', wP: '♙',
      bR: '♜', bN: '♞', bB: '♝', bQ: '♛', bK: '♚', bP: '♟'
    };

    let board = [
      ['bR','bN','bB','bQ','bK','bB','bN','bR'],
      ['bP','bP','bP','bP','bP','bP','bP','bP'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['wP','wP','wP','wP','wP','wP','wP','wP'],
      ['wR','wN','wB','wQ','wK','wB','wN','wR']
    ];

    let turn = 'w'; // 'w' veya 'b'
    let selectedSquare = null;
    let possibleMoves = [];

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const square = document.createElement('div');
          square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
          square.dataset.row = r;
          square.dataset.col = c;

          if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
            square.classList.add('selected');
          }

          if (possibleMoves.some(m => m.r === r && m.c === c)) {
            square.classList.add('highlight');
          }

          const pieceCode = board[r][c];
          if (pieceCode) {
            const pieceSpan = document.createElement('span');
            pieceSpan.className = `piece ${pieceCode.startsWith('w') ? 'white-piece' : 'black-piece'}`;
            pieceSpan.innerText = pieces[pieceCode];
            square.appendChild(pieceSpan);
          }

          square.addEventListener('click', () => handleSquareClick(r, c));
          boardEl.appendChild(square);
        }
      }
    }

    function handleSquareClick(r, c) {
      const clickedPiece = board[r][c];

      if (selectedSquare) {
        // Eğer geçerli hamlelerden birine tıklandıysa taşı hareket ettir
        if (possibleMoves.some(m => m.r === r && m.c === c)) {
          board[r][c] = board[selectedSquare.r][selectedSquare.c];
          board[selectedSquare.r][selectedSquare.c] = '';
          turn = turn === 'w' ? 'b' : 'w';
          updateStatus();
          selectedSquare = null;
          possibleMoves = [];
          renderBoard();
          return;
        }
      }

      // Kendi taşını seçme
      if (clickedPiece && clickedPiece.startsWith(turn)) {
        selectedSquare = { r, c };
        possibleMoves = getDummyMoves(r, c); // Basit hamle mantığı
        renderBoard();
      } else {
        selectedSquare = null;
        possibleMoves = [];
        renderBoard();
      }
    }

    // Basit ve akıcı tahta mantığı (tüm boş/rakip kareleri gösterir)
    function getDummyMoves(r, c) {
      let moves = [];
      const piece = board[r][c];
      
      // Piyonlar için örnek mantık
      let dir = piece.startsWith('w') ? -1 : 1;
      if (r + dir >= 0 && r + dir < 8 && board[r + dir][c] === '') {
        moves.push({ r: r + dir, c: c });
      }
      
      // Çevredeki serbest kareleri gösteren esnek dokunmatik hamleler
      for (let i = Math.max(0, r-2); i <= Math.min(7, r+2); i++) {
        for (let j = Math.max(0, c-2); j <= Math.min(7, c+2); j++) {
          if (board[i][j] === '' || !board[i][j].startsWith(turn)) {
            moves.push({ r: i, c: j });
          }
        }
      }
      return moves;
    }

    function updateStatus() {
      const statusEl = document.getElementById('game-status');
      if (turn === 'w') {
        statusEl.innerHTML = 'Sıra: <span style="color:#fff; font-weight:bold;">Beyaz Oyuncu</span>';
      } else {
        statusEl.innerHTML = 'Sıra: <span style="color:#f39c12; font-weight:bold;">Siyah Oyuncu</span>';
      }
    }

    function resetGame() {
      board = [
        ['bR','bN','bB','bQ','bK','bB','bN','bR'],
        ['bP','bP','bP','bP','bP','bP','bP','bP'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['wP','wP','wP','wP','wP','wP','wP','wP'],
        ['wR','wN','wB','wQ','wK','wB','wN','wR']
      ];
      turn = 'w';
      selectedSquare = null;
      possibleMoves = [];
      updateStatus();
      renderBoard();
    }

    window.onload = renderBoard;
  </script>
</body>
</html>
