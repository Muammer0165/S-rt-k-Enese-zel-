<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Satranç Online - Muammer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #app { display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
        
        /* 3D Tuval - Arka Planda Kalacak */
        #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* Arayüz Panelleri - Kesinlikle Tıklanabilir Olması İçin En Üstte */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.92); z-index: 100; padding: 20px; transition: opacity 0.3s ease; }
        .screen.hidden { opacity: 0; pointer-events: none; }
        
        .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 16px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; z-index: 101; }
        h1 { font-size: 22px; margin-bottom: 8px; color: #fbbf24; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; font-size: 16px; margin-bottom: 12px; text-align: center; }
        input:focus { outline: none; border-color: #fbbf24; }
        
        button { width: 100%; padding: 14px; background: #fbbf24; color: #0f172a; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        button:hover { background: #f59e0b; }
        button.secondary { background: transparent; border: 1px solid #475569; color: #cbd5e1; }

        /* Oyun Üst Bilgi */
        #game-header { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(15,23,42,0.9), transparent); z-index: 50; pointer-events: none; }
        .badge { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; pointer-events: auto; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
        
        #toast { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid #fbbf24; color: #fbbf24; padding: 10px 20px; border-radius: 30px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        #toast.show { opacity: 1; }
    </style>

    <!-- Kütüphaneler -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjZl1zNUO_LHInjq_irPol6BM1heYJpuoQ",
            authDomain: "enesvsmuammer.firebaseapp.com",
            databaseURL: "https://enesvsmuammer-default-rtdb.firebaseio.com",
            projectId: "enesvsmuammer",
            storageBucket: "enesvsmuammer.firebasestorage.app",
            messagingSenderId: "398013562280",
            appId: "1:398013562280:web:6767c66e37b57e39d2b19d",
            measurementId: "G-3XMYMR56JR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.ref = ref;
        window.set = set;
        window.onValue = onValue;
        window.update = update;
        window.get = get;
    </script>
</head>
<body>
    <div id="app">
        <div id="game-header">
            <div class="badge">
                <span class="status-dot"></span>
                <span id="connection-status">Online (Aktif)</span>
            </div>
            <div class="badge" id="room-badge" style="display:none;">Oda: <span id="current-room-id" style="color:#fbbf24; margin-left:4px;"></span></div>
        </div>

        <!-- Menü Ekranı -->
        <div id="menu-screen" class="screen">
            <div class="card">
                <h1>3D Satranç Online</h1>
                <p>Arkadaşınla gerçek zamanlı 3 boyutlu satranç oyna.</p>
                <button id="create-room-btn">Yeni Oda Oluştur</button>
                <div style="margin: 12px 0; color: #64748b; font-size: 12px;">VEYA ODA KODU İLE KATIL</div>
                <input type="text" id="room-input" placeholder="Oda Kodunu Girin">
                <button class="secondary" id="join-room-btn">Odaya Katıl</button>
            </div>
        </div>

        <!-- Bekleme Ekranı -->
        <div id="waiting-screen" class="screen hidden">
            <div class="card">
                <h1>Rakip Bekleniyor...</h1>
                <p>Oda kuruldu! Bu bağlantıyı arkadaşına gönder:</p>
                <input type="text" id="share-link" readonly style="font-size: 12px; text-align: center;">
                <button id="copy-link-btn">Bağlantıyı Kopyala</button>
            </div>
        </div>

        <div id="webgl-container"></div>
        <div id="toast">İşlem başarılı!</div>
    </div>

    <script>
        let scene, camera, renderer, chess, boardGroup = {};
        let selectedSquare = null;
        let roomId = null, playerColor = 'white';
        let gameRef = null;

        const synth = new Tone.Synth().toDestination();
        function playMoveSound() { synth.triggerAttackRelease("C4", "8n"); }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function init3D() {
            const container = document.getElementById('webgl-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 12, 12);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const boardBase = new THREE.Mesh(new THREE.BoxGeometry(9, 0.4, 9), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
            boardBase.position.y = -0.2;
            scene.add(boardBase);

            createBoardSquares();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            renderer.domElement.addEventListener('click', onCanvasClick);
            animate();
        }

        function createBoardSquares() {
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const isDark = (r + c) % 2 === 1;
                    const square = new THREE.Mesh(new THREE.BoxGeometry(1, 0.05, 1), new THREE.MeshStandardMaterial({ color: isDark ? 0x334155 : 0xe2e8f0 }));
                    square.position.set(c - 3.5, 0.02, r - 3.5);
                    square.userData = { file: files[c], rank: 8 - r };
                    scene.add(square);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function createPieceMesh(type, color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: color === 'w' ? 0xf8fafc : 0x334155 });
            let geo = new THREE.CylinderGeometry(0.3, 0.4, 0.6, 16);
            if (type === 'r') geo = new THREE.BoxGeometry(0.6, 0.8, 0.6);
            if (type === 'n') geo = new THREE.ConeGeometry(0.4, 0.9, 16);
            if (type === 'b') geo = new THREE.CylinderGeometry(0.2, 0.4, 1, 16);
            if (type === 'q') geo = new THREE.SphereGeometry(0.45, 16, 16);
            if (type === 'k') geo = new THREE.BoxGeometry(0.5, 1.2, 0.5);

            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = 0.4;
            group.add(mesh);
            return group;
        }

        function updatePieces3D(fen) {
            Object.values(boardGroup).forEach(m => scene.remove(m));
            boardGroup = {};
            const rows = fen.split(' ')[0].split('/');
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

            rows.forEach((row, r) => {
                let c = 0;
                for (let char of row) {
                    if (!isNaN(char)) c += parseInt(char);
                    else {
                        const sq = files[c] + (8 - r);
                        const color = char === char.toUpperCase() ? 'w' : 'b';
                        const mesh = createPieceMesh(char.toLowerCase(), color);
                        mesh.position.set(c - 3.5, 0, r - 3.5);
                        scene.add(mesh);
                        boardGroup[sq] = mesh;
                        c++;
                    }
                }
            });
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onCanvasClick(event) {
            // Menü açıkken tahtaya tıklanmasın
            if (!roomId || !document.getElementById('menu-screen').classList.contains('hidden') === false) return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && !obj.userData.file) obj = obj.parent;
                if (obj.userData && obj.userData.file) handleSquareClick(obj.userData.file + obj.userData.rank);
            }
        }

        function handleSquareClick(sq) {
            if ((chess.turn() === 'w' && playerColor !== 'white') || (chess.turn() === 'b' && playerColor !== 'black')) {
                showToast("Sıra rakipte!");
                return;
            }
            if (!selectedSquare) {
                const piece = chess.get(sq);
                if (piece && piece.color === chess.turn()) {
                    selectedSquare = sq;
                    showToast(sq + " seçildi");
                }
            } else {
                const move = chess.move({ from: selectedSquare, to: sq, promotion: 'q' });
                if (move) {
                    playMoveSound();
                    selectedSquare = null;
                    updatePieces3D(chess.fen());
                    window.set(window.ref(window.db, 'rooms/' + roomId), { fen: chess.fen() });
                } else {
                    selectedSquare = null;
                }
            }
        }

        function listenRoom(id) {
            roomId = id;
            window.onValue(window.ref(window.db, 'rooms/' + roomId), (snapshot) => {
                const data = snapshot.val();
                if (data && data.fen && data.fen !== chess.fen()) {
                    chess.load(data.fen);
                    updatePieces3D(data.fen);
                    playMoveSound();
                }
            });
        }

        // Buton Dinleyicileri
        document.getElementById('create-room-btn').addEventListener('click', () => {
            roomId = Math.random().toString(36).substring(2, 8);
            playerColor = 'white';
            chess = new Chess();
            
            window.set(window.ref(window.db, 'rooms/' + roomId), { fen: chess.fen() });

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('waiting-screen').classList.remove('hidden');
            
            const link = window.location.origin + window.location.pathname + "?room=" + roomId;
            document.getElementById('share-link').value = link;
            listenRoom(roomId);
        });

        document.getElementById('join-room-btn').addEventListener('click', () => {
            const code = document.getElementById('room-input').value.trim();
            if (!code) return showToast("Oda kodu girin!");
            
            roomId = code;
            playerColor = 'black';
            camera.position.set(0, 12, -12);
            camera.lookAt(0,0,0);

            chess = new Chess();
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('room-badge').style.display = 'block';
            document.getElementById('current-room-id').innerText = roomId;

            listenRoom(roomId);
            updatePieces3D(chess.fen());
        });

        document.getElementById('copy-link-btn').addEventListener('click', () => {
            const input = document.getElementById('share-link');
            input.select();
            navigator.clipboard.writeText(input.value);
            showToast("Bağlantı kopyalandı!");
        });

        window.onload = () => {
            init3D();
            chess = new Chess();
            updatePieces3D(chess.fen());

            const urlParams = new URLSearchParams(window.location.search);
            const rParam = urlParams.get('room');
            if (rParam) {
                document.getElementById('room-input').value = rParam;
                document.getElementById('join-room-btn').click();
                document.getElementById('waiting-screen').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
